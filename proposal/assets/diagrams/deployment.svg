r="start">Penyimpanan berkas: dikonfigurasi lewat Godmode (lokal / S3 / R2),</text><text x="430" y="548" font-family="Geist" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">tanpa perlu redeploy ulang.</text><rect x="980" y="290" width="280" height="300" rx="18" fill="#f7f7f5" stroke="#ececea" stroke-width="1.2"/><text x="1005" y="322" font-family="Geist" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="0.12em">VPS TERPISAH</text><rect x="1000" y="350" width="240" height="110" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="1000" y="350" width="240" height="6" rx="3" fill="#f94141"/><g transform="translate(1020 374)" stroke="#f94141"><g stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" fill="none"><rect x="8.96" y="0" width="10.08" height="16.24" rx="5.04"/><path d="M3.9200000000000004 11.76 A10.08 10.08 0 0 0 24.08 11.76"/><line x1="14.0" y1="21.84" x2="14.0" y2="28"/></g></g><text x="1058" y="394" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">LiveKit + Caddy</text><text x="1058" y="416" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Media WebRTC + reverse proxy</text><text x="1058" y="435" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">UDP mux dipublikasikan langsung</text><rect x="1058" y="452" width="128" height="21" rx="6" fill="#fee5e5"/><text x="1066" y="467" font-family="Geist Mono" font-size="12" font-weight="500" fill="#f94141" text-anchor="start">443 / UDP 7882</text><text x="1005" y="500" font-family="Geist" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Dipisah dari Railway karena</text><text x="1005" y="518" font-family="Geist" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">Railway tidak menyediakan</text><text x="1005" y="536" font-family="Geist" font-size="12.5" font-weight="400" fill="#6b7280" text-anchor="start">ingress UDP publik untuk media.</text><line x1="700" y1="240" x2="700" y2="290" stroke="#f7bf33" stroke-width="2" marker-end="url(#arrowhead)"/><path d="M 700 240 Q 970.0 265.0 1120 290" fill="none" stroke="#f7bf33" stroke-width="2" marker-end="url(#arrowhead)"/><text x="700" y="640" font-family="Geist" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">Firewall (ufw) di VPS hanya membuka 22/80/443/7882 — default deny untuk selebihnya.</text><text x="700" y="700" font-family="Geist" font-size="12.5" font-weight="400" fill="#9aa1ad" text-anchor="middle">Catatan kejujuran teknis: rekaman panggilan (LiveKit Egress) belum aktif di VPS 2GB saat ini —</text><text x="700" y="718" font-family="Geist" font-size="12.5" font-weight="400" fill="#9aa1ad" text-anchor="middle">kemampuannya sudah ada di kode, tinggal menambah sumber daya.</text></svg>