<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760"><rect width="1400" height="760" fill="#ffffff"/><defs><marker id="arrowhead" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#3a6dc5"/></marker></defs><text x="60" y="56" font-family="Geist" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="0.12em">METODE PENGEMBANGAN</text><text x="60" y="92" font-family="Bricolage Grotesque" font-size="32" font-weight="700" fill="#0e1116" text-anchor="start">Siklus Iteratif Pengembangan Atlas</text><text x="60" y="118" font-family="Geist" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">Enam tahap berulang, bukan air terjun satu arah — tiap rilis kembali ke tahap Temukan.</text><rect x="585.0" y="125.0" width="230" height="110" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="585.0" y="125.0" width="230" height="6" rx="3" fill="#3a6dc5"/><text x="609.0" y="169.0" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">1. Temukan</text><text x="609.0" y="191.0" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Wawancara &amp; riset kebutuhan</text><rect x="810.166604983954" y="255.0" width="230" height="110" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="810.166604983954" y="255.0" width="230" height="6" rx="3" fill="#0f8657"/><text x="834.166604983954" y="299.0" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">2. Rancang</text><text x="834.166604983954" y="321.0" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Wireframe &amp; sistem desain</text><rect x="810.1666049839541" y="515.0" width="230" height="110" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="810.1666049839541" y="515.0" width="230" height="6" rx="3" fill="#f7bf33"/><text x="834.1666049839541" y="559.0" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">3. Bangun</text><text x="834.1666049839541" y="581.0" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Implementasi fitur</text><rect x="585.0" y="645.0" width="230" height="110" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="585.0" y="645.0" width="230" height="6" rx="3" fill="#f94141"/><text x="609.0" y="689.0" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">4. Uji</text><text x="609.0" y="711.0" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Jest, Playwright, axe-core</text><rect x="359.833395016046" y="515.0000000000001" width="230" height="110" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="359.833395016046" y="515.0000000000001" width="230" height="6" rx="3" fill="#3a6dc5"/><text x="383.833395016046" y="559.0000000000001" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">5. Rilis</text><text x="383.833395016046" y="581.0000000000001" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Deploy ke produksi</text><rect x="359.83339501604587" y="255.00000000000017" width="230" height="110" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="359.83339501604587" y="255.00000000000017" width="230" height="6" rx="3" fill="#0f8657"/><text x="383.83339501604587" y="299.00000000000017" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">6. Pelajari</text><text x="383.83339501604587" y="321.00000000000017" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Metrik &amp; umpan balik</text><path d="M 809 142 Q 865 154 904 197" fill="non