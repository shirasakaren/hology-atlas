<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="950" viewBox="0 0 1400 950"><rect width="1400" height="950" fill="#ffffff"/><defs><marker id="arrowhead" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#002EA6"/></marker></defs><text x="60" y="56" font-family="Times New Roman" font-size="10.5" font-weight="700" fill="#6b6b6b" text-anchor="start" letter-spacing="0.1em">METODE PENGEMBANGAN</text><text x="60" y="92" font-family="Times New Roman" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="start">Siklus Iteratif Pengembangan Atlas</text><text x="60" y="118" font-family="Times New Roman" font-size="14" font-weight="400" fill="#6b6b6b" text-anchor="start">Enam tahap berulang, bukan air terjun satu arah: tiap rilis kembali ke tahap Temukan.</text><rect x="590.0" y="140.0" width="220" height="100" rx="2" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/><rect x="590.0" y="140.0" width="220" height="2.5" fill="#002EA6"/><text x="608.0" y="170.0" font-family="Times New Roman" font-size="15.5" font-weight="700" fill="#1a1a1a" text-anchor="start">1. Temukan</text><text x="608.0" y="188.0" font-family="Times New Roman" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">Wawancara &amp; riset kebutuhan</text><rect x="858.467875173176" y="295.0" width="220" height="100" rx="2" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/><rect x="858.467875173176" y="295.0" width="220" height="2.5" fill="#002EA6"/><text x="876.467875173176" y="325.0" font-family="Times New Roman" font-size="15.5" font-weight="700" fill="#1a1a1a" text-anchor="start">2. Rancang</text><text x="876.467875173176" y="343.0" font-family="Times New Roman" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">Wireframe &amp; sistem desain</text><rect x="858.467875173176" y="605.0" width="220" height="100" rx="2" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/><rect x="858.467875173176" y="605.0" width="22