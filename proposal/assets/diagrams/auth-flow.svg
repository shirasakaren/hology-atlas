xt><rect x="960" y="430" width="300" height="100" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="960" y="430" width="300" height="6" rx="3" fill="#f94141"/><g transform="translate(980 454)" stroke="#3a6dc5"><g stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M14.0 0 L28 5.6000000000000005 V14.0 C28 22.959999999999997 20.16 28 14.0 28 C7.840000000000001 28 0 22.959999999999997 0 14.0 V5.6000000000000005 Z"/></g></g><text x="1018" y="474" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">Setiap Permintaan API</text><text x="1018" y="496" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Header disertakan otomatis</text><text x="1018" y="515" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Divalidasi ulang tiap request</text><rect x="1018" y="532" width="224" height="21" rx="6" fill="#fee5e5"/><text x="1026" y="547" font-family="Geist Mono" font-size="12" font-weight="500" fill="#f94141" text-anchor="start">Authorization: Bearer &lt;id&gt;</text><line x1="700" y1="390" x2="290" y2="430" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/><rect x="434.0" y="398.0" width="122" height="19" rx="5" fill="#ffffff" stroke="#ececea" stroke-width="1"/><text x="495.0" y="412.0" font-family="Geist Mono" font-size="12.5" font-weight="500" fill="#3b4150" text-anchor="middle">simpan baris</text><line x1="700" y1="390" x2="700" y2="430" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/><rect x="625.5" y="398.0" width="149" height="19" rx="5" fill="#ffffff" stroke="#ececea" stroke-width="1"/><text x="700.0" y="412.0" font-family="Geist Mono" font-size="12.5" font-weight="500" fill="#3b4150" text-anchor="middle">kirim ke client</text><line x1="840" y1="480" x2="960" y2="480" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowhead)"/><rect x="830.0" y="468.0" width="140" height="19" rx="5" fill="#ffffff" stroke="#ececea" stroke-width="1"/><text x="900.0" y="482.0" font-family="Geist Mono" font-size="12.5" font-weight="500" fill="#3b4150" text-anchor="middle">tiap panggilan</text><text x="700" y="600" font-family="Geist" font-size="13" font-weight="400" fill="#6b7280" text-anchor="middle">Metode masuk berbeda-beda, tetapi semuanya bermuara pada satu penerbit sesi — konsisten dan mudah diaudit.</text></svg>