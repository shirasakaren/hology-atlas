<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><rect width="1400" height="620" fill="#ffffff"/><defs><marker id="arrowhead" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#9aa1ad"/></marker></defs><text x="60" y="56" font-family="Geist" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="0.12em">ARSITEKTUR SISTEM</text><text x="60" y="92" font-family="Bricolage Grotesque" font-size="32" font-weight="700" fill="#0e1116" text-anchor="start">Alur Autentikasi &amp; Sesi</text><rect x="45.0" y="170" width="205" height="64" rx="12" fill="#ecf1fa" stroke="#3a6dc5" stroke-width="1.2"/><text x="147.5" y="207.0" font-family="Geist" font-size="13.5" font-weight="600" fill="#3a6dc5" text-anchor="middle">Kata sandi</text><rect x="266.0" y="170" width="205" height="64" rx="12" fill="#ecf1fa" stroke="#3a6dc5" stroke-width="1.2"/><text x="368.5" y="207.0" font-family="Geist" font-size="13.5" font-weight="600" fill="#3a6dc5" text-anchor="middle">Magic link</text><rect x="487.0" y="170" width="205" height="64" rx="12" fill="#ecf1fa" stroke="#3a6dc5" stroke-width="1.2"/><text x="589.5" y="207.0" font-family="Geist" font-size="13.5" font-weight="600" fill="#3a6dc5" text-anchor="middle">OTP telepon</text><rect x="708.0" y="170" width="205" height="64" rx="12" fill="#ecf1fa" stroke="#3a6dc5" stroke-width="1.2"/><text x="810.5" y="207.0" font-family="Geist" font-size="13.5" font-weight="600" fill="#3a6dc5" text-anchor="middle">Passphrase instansi</text><rect x="929.0" y="170" width="205" height="64" rx="12" fill="#ecf1fa" stroke="#3a6dc5" stroke-width="1.2"/><text x="1031.5" y="207.0" font-family="Geist" font-size="13.5" font-weight="600" fill="#3a6dc5" text-anchor="middle">OAuth2</text><rect x="1150.0" y="170" width="205" height="64" rx="12" fill="#ecf1fa" stroke="#3a6dc5" stroke-width="1.2"/><text x="1252.5" y="207.0" font-family="Geist" font-size="13.5" font-weight="600" fill="#3a6dc5" text-anchor="middle">OIDC / SAML</text><text x="700" y="150" font-family="Geist" font-size="14" font-weight="500" fill="#6b7280" text-anchor="middle">Pengguna memilih metode masuk</text><rect x="560" y="300" width="280" height="90" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="560" y="300" width="280" height="6" rx="3" fill="#3a6dc5"/><g transform="translate(580 324)" stroke="#3a6dc5"><g stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M14.0 0 L28 5.6000000000000005 V14.0 C28 22.959999999999997 20.16 28 14.0 28 C7.840000000000001 28 0 22.959999999999997 0 14.0 V5.6000000000000005 Z"/></g></g><text x="618" y="344" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">AuthService.issueSession()</text><text x="618" y="366" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">Backend menerbitkan sesi</text><text x="618" y="385" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">satu jalur untuk semua metode</text><line x1="147.5" y1="234" x2="700" y2="300" stroke="#d8d8d2" stroke-width="1.5" marker-end="url(#arrowhead)"/><line x1="368.5" y1="234" x2="700" y2="300" stroke="#d8d8d2" stroke-width="1.5" marker-end="url(#arrowhead)"/><line x1="589.5" y1="234" x2="700" y2="300" stroke="#d8d8d2" stroke-width="1.5" marker-end="url(#arrowhead)"/><line x1="810.5" y1="234" x2="700" y2="300" stroke="#d8d8d2" stroke-width="1.5" marker-end="url(#arrowhead)"/><line x1="1031.5" y1="234" x2="700" y2="300" stroke="#d8d8d2" stroke-width="1.5" marker-end="url(#arrowhead)"/><line x1="1252.5" y1="234" x2="700" y2="300" stroke="#d8d8d2" stroke-width="1.5" marker-end="url(#arrowhead)"/><rect x="140" y="430" width="300" height="100" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="140" y="430" width="300" height="6" rx="3" fill="#0f8657"/><g transform="translate(