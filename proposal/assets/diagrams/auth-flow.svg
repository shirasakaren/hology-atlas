<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620"><rect width="1400" height="620" fill="#ffffff"/><defs><marker id="arrowhead" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 z" fill="#9a9a9a"/></marker></defs><text x="60" y="56" font-family="Times New Roman" font-size="10.5" font-weight="700" fill="#6b6b6b" text-anchor="start" letter-spacing="0.1em">ARSITEKTUR SISTEM</text><text x="60" y="92" font-family="Times New Roman" font-size="32" font-weight="700" fill="#1a1a1a" text-anchor="start">Alur Autentikasi &amp; Sesi</text><rect x="45.0" y="170" width="205" height="64" rx="12" fill="#e8ecf7" stroke="#002EA6" stroke-width="1.2"/><text x="147.5" y="207.0" font-family="Times New Roman" font-size="13.5" font-weight="600" fill="#002EA6" text-anchor="middle">Kata sandi</text><rect x="266.0" y="170" width="205" height="64" rx="12" fill="#e8ecf7" stroke="#002EA6" stroke-width="1.2"/><text x="368.5" y="207.0" font-family="Times New Roman" font-size="13.5" font-weight="600" fill="#002EA6" text-anchor="middle">Magic link</text><rect x="487.0" y="170" width="205" height="64" rx="12" fill="#e8ecf7" stroke="#002EA6" stroke-width="1.2"/><text x="589.5" y="207.0" font-family="Times New Roman" font-size="13.5" font-weight="600" fill="#002EA6" text-anchor="middle">OTP telepon</text><rect x="708.0" y="170" width="205" height="64" rx="12" fill="#e8ecf7" stroke="#002EA6" stroke-width="1.2"/><text x="810.5" y="207.0" font-family="Times New Roman" font-size="13.5" font-weight="600" fill="#002EA6" text-anchor="middle">Passphrase instansi</text><rect x="929.0" y="170" width="205" height="64" rx="12" fill="#e8ecf7" stroke="#002EA6" stroke-width="1.2"/><text x="1031.5" y="207.0" font-family="Times New Roman" font-size="13.5" font-weight="600" fill="#002EA6" text-anchor="middle">OAuth2</text><rect x="1150.0" y="170" width="205" height="64" rx="12" fill="#e8ecf7" stroke="#002EA6" stroke-width="1.2"/><text x="1252.5" y="207.0" font-family="Times New Roman" font-size="13.5" font-weight="600" fill="#002EA6" text-anchor="middle">OIDC / SAML</text><text x="700" y="150" font-family="Times New Roman" font-size="14" font-weight="500" fill="#6b6b6b" text-anchor="middle">Pengguna memilih metode masuk</text><rect x="560" y="300" width="280" height="90" rx="2" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/><rect x="560" y="300" width="280" height="2.5" fill="#002EA6"/><g transform="translate(576 316)" stroke="#002EA6"><g stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M10.0 0 L20 4.0 V10.0 C20 16.4 14.399999999999999 20 10.0 20 C5.6000000000000005 20 0 16.4 0 10.0 V4.0 Z"/></g></g><text x="604" y="330" font-family="Times New Roman" font-size="15.5" font-weight="700" fill="#1a1a1a" text-anchor="start">AuthService.issueSession()</text><text x="604" y="348" font-family="Times New Roman" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">Backend menerbitkan sesi</text><text x="604" y="363" font-family="Times New Roman" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">satu jalur untuk semua metode</text><line x1="147.5" y1="234" x2="700" y2="300" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrowhead)"/><line x1="368.5" y1="234" x2="700" y2="300" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrowhead)"/><line x1="589.5" y1="234" x2="700" y2="300" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrowhead)"/><line x1="810.5" y1="234" x2="700" y2="300" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrowhead)"/><line x1="1031.5" y1="234" x2="700" y2="300" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrowhead)"/><line x1="1252.5" y1="234" x2="700" y2="300" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrowhead)"/><rect x="140" y="430" width="300" height="100" rx="2" fill="#ffffff" stroke="#8a8a8a" stroke-width="1"/><rect x="140" y="430" width="300" height="2.5" fill="#002EA