<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="980" viewBox="0 0 1500 980"><rect width="1500" height="980" fill="#ffffff"/><defs><marker id="arrowhead" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto"><path d="M0,0 L10,4.5 L0,9 z" fill="#9aa1ad"/></marker></defs><text x="60" y="56" font-family="Geist" font-size="12" font-weight="700" fill="#6b7280" text-anchor="start" letter-spacing="0.12em">ARSITEKTUR SISTEM</text><text x="60" y="92" font-family="Bricolage Grotesque" font-size="32" font-weight="700" fill="#0e1116" text-anchor="start">Model Data Inti (ERD Disederhanakan)</text><text x="60" y="118" font-family="Geist" font-size="14" font-weight="400" fill="#6b7280" text-anchor="start">13 entitas utama dari skema Prisma penuh — kolom lengkap tersedia di source code.</text><rect x="610" y="150" width="280" height="100" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="610" y="150" width="280" height="6" rx="3" fill="#3a6dc5"/><text x="634" y="194" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">User</text><text x="634" y="216" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">id, email, name</text><text x="634" y="235" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">avatarUrl, isAdmin</text><rect x="60" y="320" width="230" height="90" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="60" y="320" width="230" height="6" rx="3" fill="#3b4150"/><text x="84" y="364" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">Session</text><text x="84" y="386" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">sessionId (opaque)</text><text x="84" y="405" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">expiresAt, method</text><rect x="320" y="320" width="230" height="90" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="320" y="320" width="230" height="6" rx="3" fill="#3b4150"/><text x="344" y="364" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">UserRole</text><text x="344" y="386" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">userId -&gt; roleId</text><rect x="320" y="470" width="230" height="90" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="320" y="470" width="230" height="6" rx="3" fill="#3b4150"/><text x="344" y="514" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">Role</text><text x="344" y="536" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">code, permissions[]</text><rect x="60" y="470" width="230" height="90" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="60" y="470" width="230" height="6" rx="3" fill="#3b4150"/><text x="84" y="514" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">Notification</text><text x="84" y="536" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">type, title, link</text><text x="84" y="555" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">readAt</text><rect x="610" y="320" width="280" height="90" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="610" y="320" width="280" height="6" rx="3" fill="#0f8657"/><text x="634" y="364" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">ProjectMember</text><text x="634" y="386" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">userId, projectId, role</text><rect x="610" y="470" width="280" height="90" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="610" y="470" width="280" height="6" rx="3" fill="#0f8657"/><text x="634" y="514" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">Project</text><text x="634" y="536" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">slug, title, phase</text><text x="634" y="555" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">visibility</text><rect x="610" y="620" width="280" height="90" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="610" y="620" width="280" height="6" rx="3" fill="#0f8657"/><text x="634" y="664" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">TaskList</text><text x="634" y="686" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">name, projectKey</text><text x="634" y="705" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">taskCounter</text><rect x="560" y="770" width="230" height="90" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="560" y="770" width="230" height="6" rx="3" fill="#0f8657"/><text x="584" y="814" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">Task</text><text x="584" y="836" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">key, title, status</text><text x="584" y="855" font-family="Geist" font-size="13.5" font-weight="400" fill="#6b7280" text-anchor="start">priority, dueAt</text><rect x="850" y="770" width="230" height="90" rx="14" fill="#ffffff" stroke="#d8d8d2" stroke-width="1.5"/><rect x="850" y="770" width="230" height="6" rx="3" fill="#0f8657"/><text x="874" y="814" font-family="Bricolage Grotesque" font-size="19" font-weight="700" fill="#0e1116" text-anchor="start">TaskAssignee</text><text x="874" y="836" font-family="Geist"